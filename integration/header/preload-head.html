<!-- Optional: move this preload block into head for the earliest discovery. -->
<!-- Declarative links are discovered even while earlier scripts block parsing. -->
<link rel="preconnect" href="https://forumstatic.ru">
<link rel="preload" as="image" href="https://forumstatic.ru/files/001c/25/f9/42433.webp?v=1" media="(prefers-color-scheme: light)" fetchpriority="high" data-fantasy-header-preload="light">
<link rel="preload" as="image" href="https://forumstatic.ru/files/001c/25/f9/47523.webp?v=1" media="(prefers-color-scheme: dark)" fetchpriority="high" data-fantasy-header-preload="dark">
<script>
(function () {
 'use strict';
 var root=document.documentElement,saved;
 try{saved=localStorage.getItem('forum-index-theme');}catch(e){}
 var dark=saved==='dark'||(saved!=='light'&&(root.dataset.theme==='dark'||root.classList.contains('dark')||(!root.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches)));
 var theme=dark?'dark':'light';
 document.querySelectorAll('link[data-fantasy-header-preload]').forEach(function(link){
  link.media=link.getAttribute('data-fantasy-header-preload')===theme?'all':'not all';
  if(link.media==='all'&&!document.getElementById('fantasy-header-preload'))link.id='fantasy-header-preload';
 });
})();
</script>
